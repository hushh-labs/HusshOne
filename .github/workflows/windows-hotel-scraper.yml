name: Windows hotel scraper

on:
  pull_request:
    paths:
      - 'services/hotel-scraper-windows/**'
      - '.github/workflows/windows-hotel-scraper.yml'
  push:
    branches: [main]
    paths:
      - 'services/hotel-scraper-windows/**'
      - '.github/workflows/windows-hotel-scraper.yml'

permissions:
  contents: read

concurrency:
  group: windows-hotel-scraper-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scraper_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: scraper_ci_windows
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scraper_ci -d scraper_ci_windows"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/hotel-scraper-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix app/vm_sources
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          SCRAPER_TEST_POSTGRES_URL: postgresql+psycopg2://scraper_ci:disposable_ci_password@127.0.0.1:5432/scraper_ci_windows
      - run: python -c "import pathlib,subprocess; subprocess.run(['node','--test',*[str(p) for p in pathlib.Path('app/vm_sources').rglob('*.test.mjs')]],check=True)"

  windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/hotel-scraper-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix app/vm_sources
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -c "import pathlib,subprocess; subprocess.run(['node','--test',*[str(p) for p in pathlib.Path('app/vm_sources').rglob('*.test.mjs')]],check=True)"
