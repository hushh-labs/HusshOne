name: Deploy NWS Nearby production

on:
  workflow_run:
    workflows: [NWS Nearby CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nws-nearby-production
  cancel-in-progress: false

env:
  PROJECT_ID: hushh-tech-prod
  REGION: us-central1
  SERVICE: nws-nearby-intelligence
  REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: nws-nearby-intelligence
  SOURCE_STAGING_DIR: gs://hushh-tech-prod-nws-nearby-source/source
  BUILD_LOG_DIR: gs://hushh-tech-prod-nws-nearby-build-logs/logs
  BUILD_SA: projects/hushh-tech-prod/serviceAccounts/nws-nearby-build@hushh-tech-prod.iam.gserviceaccount.com
  RUNTIME_SA: nws-nearby-runtime@hushh-tech-prod.iam.gserviceaccount.com
  # Blue/green data plane: registry-v4 publishes to its own pointer while the
  # v3 job/pointer remains healthy for immediate Cloud Run rollback.
  SNAPSHOT_JOB: nws-net-worth-refresh-v4
  LEGACY_SNAPSHOT_JOB: nws-net-worth-refresh
  SNAPSHOT_RUNTIME_SA: nws-net-worth-collector-v4@hushh-tech-prod.iam.gserviceaccount.com
  SNAPSHOT_BUCKET: hushh-tech-prod-nws-published-snapshots
  SNAPSHOT_PREFIX: published/net-worth-v1.0.0/registry-v4
  LEGACY_SNAPSHOT_PREFIX: published/net-worth-v1.0.0
  CONSENT_RECEIPT_BUCKET: hushh-tech-prod-nws-consent-receipts
  SOURCE_REGISTRY_PATH: /app/config/sources.yaml
  SOURCE_REGISTRY_MANIFEST_PATH: /app/config/source-registry-manifest.json
  SOURCE_REGISTRY_SHA256: bc87c8b8a3484e401871c43b2b79ee5b943877dca5c7a046f9da750bb525aaed
  SOURCE_REGISTRY_VERSION: '4'
  SECRET_NAME: nws-nearby-api-key
  V4_API_KEY_SECRET_NAME: nws-husshone-v4-api-key
  CONSUMER_REGISTRY_SECRET_NAME: nws-consumer-access-registry
  CONSUMER_REGISTRY_SHA256: df2f5ec0e458db9b92ac937b3b98e9d0b2f335dabffdeb2f19a3b01e272660c0
  PROFESSIONAL_SECRET_NAME: insider-professional-api-key
  FORM6_SECRET_NAME: nws-form6-api-key
  NPPES_DB_SECRET_NAME: nws-nearby-nppes-db-password
  CLOUD_SQL_INSTANCE: hushh-tech-prod:us-central1:hushh-directories-db
  # Advance deliberately after adding a Secret Manager version; do not use latest.
  NWS_API_KEY_SECRET_VERSION: '1'
  V4_API_KEY_SECRET_VERSION: '2'
  CONSUMER_REGISTRY_SECRET_VERSION: '2'
  PROFESSIONAL_API_KEY_SECRET_VERSION: '2'
  FORM6_API_KEY_SECRET_VERSION: '1'
  NPPES_DB_PASSWORD_SECRET_VERSION: '1'
  # What the promotion gate requires /ready to report about the consumer
  # registry. Declared here rather than written into the jq expression so that
  # registering a consumer is one contiguous edit — secret version, SHA-256,
  # expected registry version and expected consumer count all move together.
  # Splitting them is how a registry bump passes review while the gate that is
  # supposed to police it still asserts the state before the change.
  #
  # An exact consumer count, not a floor: a registry that gained a consumer
  # nobody reviewed is precisely what this gate exists to catch, and ">= 1"
  # cannot see it.
  CONSUMER_REGISTRY_EXPECTED_VERSION: '2'
  CONSUMER_REGISTRY_EXPECTED_CONSUMERS: '3'

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: nws-nearby-production
    defaults:
      run:
        working-directory: services/nws-nearby-intelligence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/646258530541/locations/global/workloadIdentityPools/github-actions/providers/nws-nearby-husshone-production
          service_account: nws-nearby-deployer@hushh-tech-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build and push immutable image
        id: image
        run: |
          DEPLOY_SHA='${{ github.event.workflow_run.head_sha || github.sha }}'
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${DEPLOY_SHA}"
          BUILD_ID="$(gcloud builds submit --async --quiet --project="$PROJECT_ID" \
            --service-account="$BUILD_SA" \
            --gcs-source-staging-dir="$SOURCE_STAGING_DIR" \
            --gcs-log-dir="$BUILD_LOG_DIR" \
            --tag="$IMAGE_URI" --format='value(id)' .)"
          test -n "$BUILD_ID"
          for ATTEMPT in $(seq 1 120); do
            BUILD_STATUS="$(gcloud builds describe "$BUILD_ID" --project="$PROJECT_ID" --format='value(status)')"
            case "$BUILD_STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds describe "$BUILD_ID" --project="$PROJECT_ID" \
                  --format='yaml(status,statusDetail,logUrl)'
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          test "${BUILD_STATUS:-}" = 'SUCCESS'
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_URI" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          echo "uri=${IMAGE_URI%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Refresh and verify the published net-worth snapshot
        id: snapshot
        run: |
          set -euo pipefail
          IMAGE='${{ steps.image.outputs.uri }}'
          test "$SNAPSHOT_JOB" != "$LEGACY_SNAPSHOT_JOB"
          LEGACY_JOB="$(gcloud run jobs describe "$LEGACY_SNAPSHOT_JOB" \
            --project="$PROJECT_ID" --region="$REGION" --format=json)"
          jq -e --arg prefix "$LEGACY_SNAPSHOT_PREFIX" '
            def task_template:
              (.template?.template? // .spec?.template?.spec?.template?.spec?);
            task_template as $task |
            $task.containers[0].command == ["python"] and
            $task.containers[0].args == ["-m", "app.jobs.refresh_net_worth"] and
            any($task.containers[0].env[]?;
              .name == "NWS_SNAPSHOT_PREFIX" and .value == $prefix) and
            any($task.containers[0].env[]?;
              .name == "NWS_SOURCE_REGISTRY_VERSION" and .value == "3")
          ' <<<"$LEGACY_JOB" >/dev/null
          LEGACY_POINTER_BEFORE="$(gcloud storage objects describe \
            "gs://${SNAPSHOT_BUCKET}/${LEGACY_SNAPSHOT_PREFIX}/active.json" \
            --project="$PROJECT_ID" --format='value(generation)')"
          test -n "$LEGACY_POINTER_BEFORE"
          JOB_BEFORE="$(gcloud run jobs describe "$SNAPSHOT_JOB" \
            --project="$PROJECT_ID" --region="$REGION" --format=json)"
          jq -e --arg runtime_sa "$SNAPSHOT_RUNTIME_SA" '
            def task_template:
              (.template?.template? // .spec?.template?.spec?.template?.spec?);
            task_template as $task |
            ($task.serviceAccount // $task.serviceAccountName) == $runtime_sa and
            $task.containers[0].command == ["python"] and
            $task.containers[0].args == ["-m", "app.jobs.refresh_net_worth"]
          ' <<<"$JOB_BEFORE" >/dev/null
          BUCKET_BEFORE="$(gcloud storage buckets describe "gs://$SNAPSHOT_BUCKET" \
            --project="$PROJECT_ID" --format=json)"
          jq -e '
            .uniform_bucket_level_access == true and
            .public_access_prevention == "enforced" and
            .versioning_enabled == true and
            (.soft_delete_policy.retentionDurationSeconds | tonumber) >= 2592000
          ' <<<"$BUCKET_BEFORE" >/dev/null
          gcloud run jobs update "$SNAPSHOT_JOB" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="$IMAGE" \
            --update-env-vars="NWS_SNAPSHOT_BUCKET=$SNAPSHOT_BUCKET,NWS_SNAPSHOT_PREFIX=$SNAPSHOT_PREFIX,NWS_SOURCE_REGISTRY_PATH=$SOURCE_REGISTRY_PATH,NWS_SOURCE_REGISTRY_MANIFEST_PATH=$SOURCE_REGISTRY_MANIFEST_PATH,NWS_SOURCE_REGISTRY_SHA256=$SOURCE_REGISTRY_SHA256,NWS_SOURCE_REGISTRY_VERSION=$SOURCE_REGISTRY_VERSION,NWS_FORM6_API_BASE_URL=https://insider-holdings-api-fro3hygenq-uc.a.run.app,NWS_FORM6_TIMEOUT_SECONDS=8,NWS_FORM6_REQUEST_INTERVAL_SECONDS=2.1,NWS_FORM6_MAX_RATE_LIMIT_RETRIES=2,NWS_FORM6_MAX_RETRY_AFTER_SECONDS=30,NWS_FORM6_REFRESH_DEADLINE_SECONDS=600,NWS_SNAPSHOT_MAX_RECORDS_PER_JURISDICTION=1000" \
            --update-secrets="NWS_FORM6_API_KEY=${FORM6_SECRET_NAME}:${FORM6_API_KEY_SECRET_VERSION}" \
            --quiet
          JOB_AFTER="$(gcloud run jobs describe "$SNAPSHOT_JOB" \
            --project="$PROJECT_ID" --region="$REGION" --format=json)"
          jq -e \
            --arg image "$IMAGE" \
            --arg runtime_sa "$SNAPSHOT_RUNTIME_SA" \
            --arg registry_sha256 "$SOURCE_REGISTRY_SHA256" \
            --arg registry_version "$SOURCE_REGISTRY_VERSION" \
            --arg form6_secret "$FORM6_SECRET_NAME" \
            --arg form6_secret_version "$FORM6_API_KEY_SECRET_VERSION" '
            def task_template:
              (.template?.template? // .spec?.template?.spec?.template?.spec?);
            def secret_name:
              (.valueFrom?.secretKeyRef?.name // .valueSource?.secretKeyRef?.secret // "");
            def secret_version:
              (.valueFrom?.secretKeyRef?.key // .valueSource?.secretKeyRef?.version // "");
            task_template as $task |
            ($task.serviceAccount // $task.serviceAccountName) == $runtime_sa and
            $task.containers[0].image == $image and
            $task.containers[0].command == ["python"] and
            $task.containers[0].args == ["-m", "app.jobs.refresh_net_worth"] and
            any($task.containers[0].env[]?;
              .name == "NWS_SOURCE_REGISTRY_SHA256" and .value == $registry_sha256) and
            any($task.containers[0].env[]?;
              .name == "NWS_SOURCE_REGISTRY_VERSION" and .value == $registry_version) and
            any($task.containers[0].env[]?;
              .name == "NWS_FORM6_REQUEST_INTERVAL_SECONDS" and .value == "2.1") and
            any($task.containers[0].env[]?;
              .name == "NWS_FORM6_MAX_RATE_LIMIT_RETRIES" and .value == "2") and
            any($task.containers[0].env[]?;
              .name == "NWS_FORM6_MAX_RETRY_AFTER_SECONDS" and .value == "30") and
            any($task.containers[0].env[]?;
              .name == "NWS_FORM6_REFRESH_DEADLINE_SECONDS" and .value == "600") and
            any($task.containers[0].env[]?;
              .name == "NWS_FORM6_API_KEY" and
              ((secret_name) == $form6_secret or (secret_name | endswith("/secrets/" + $form6_secret))) and
              (secret_version) == $form6_secret_version)
          ' <<<"$JOB_AFTER" >/dev/null
          gcloud run jobs execute "$SNAPSHOT_JOB" \
            --project="$PROJECT_ID" --region="$REGION" \
            --wait --quiet
          LEGACY_POINTER_AFTER="$(gcloud storage objects describe \
            "gs://${SNAPSHOT_BUCKET}/${LEGACY_SNAPSHOT_PREFIX}/active.json" \
            --project="$PROJECT_ID" --format='value(generation)')"
          test "$LEGACY_POINTER_AFTER" = "$LEGACY_POINTER_BEFORE"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          ACTIVE_OBJECT="${SNAPSHOT_PREFIX}/active.json"
          gcloud storage cp "gs://${SNAPSHOT_BUCKET}/${ACTIVE_OBJECT}" \
            "$TMP_DIR/active.json" --project="$PROJECT_ID" --quiet
          jq -e --arg source_registry_sha256 "$SOURCE_REGISTRY_SHA256" '
            .schema_version == "nws-net-worth-active-pointer-v1" and
            (.snapshot_id | type == "string" and length > 0) and
            (.snapshot_object | type == "string" and length > 0) and
            (.snapshot_generation | type == "string" and test("^[1-9][0-9]*$")) and
            (.snapshot_sha256 | test("^[0-9a-f]{64}$")) and
            .snapshot_schema_version == "nws-net-worth-snapshot-v1" and
            .source_registry_sha256 == $source_registry_sha256 and
            (.generated_at | type == "string" and length > 0) and
            (.published_at | type == "string" and length > 0)
          ' "$TMP_DIR/active.json" >/dev/null
          SNAPSHOT_ID="$(jq -r '.snapshot_id' "$TMP_DIR/active.json")"
          SNAPSHOT_OBJECT="$(jq -r '.snapshot_object' "$TMP_DIR/active.json")"
          SNAPSHOT_GENERATION="$(jq -r '.snapshot_generation | tostring' "$TMP_DIR/active.json")"
          SNAPSHOT_SHA256="$(jq -r '.snapshot_sha256' "$TMP_DIR/active.json")"
          [[ "$SNAPSHOT_ID" =~ ^nwsnw_[0-9a-f]{24}$ ]] || {
            echo "Active pointer contains an unsafe snapshot ID" >&2
            exit 1
          }
          test "$SNAPSHOT_OBJECT" = "${SNAPSHOT_PREFIX}/releases/${SNAPSHOT_ID}.json" || {
            echo "Active pointer references an unexpected object" >&2
            exit 1
          }
          gcloud storage cp \
            "gs://${SNAPSHOT_BUCKET}/${SNAPSHOT_OBJECT}#${SNAPSHOT_GENERATION}" \
            "$TMP_DIR/snapshot.json" --project="$PROJECT_ID" --quiet
          printf '%s  %s\n' "$SNAPSHOT_SHA256" "$TMP_DIR/snapshot.json" | sha256sum --check --status
          jq -e --arg snapshot_id "$SNAPSHOT_ID" \
            --arg source_registry_sha256 "$SOURCE_REGISTRY_SHA256" \
            --arg source_registry_version "$SOURCE_REGISTRY_VERSION" '
            .schema_version == "nws-net-worth-snapshot-v1" and
            .snapshot_id == $snapshot_id and
            .source_registry_sha256 == $source_registry_sha256 and
            .source_registry_id == "nws-nearby-source-registry" and
            .source_registry_version == ($source_registry_version | tonumber) and
            .model_version == "net-worth-v1.0.0" and
            .scale_version == "nws-fixed-us-log-v1.0.0" and
            (.source | type == "object") and
            (.jurisdictions | type == "array") and
            (.profiles | type == "array")
          ' \
            "$TMP_DIR/snapshot.json" >/dev/null
          echo "id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          echo "sha256=$SNAPSHOT_SHA256" >> "$GITHUB_OUTPUT"
          jq '{snapshot_id,snapshot_object,snapshot_generation,snapshot_sha256,published_at}' \
            "$TMP_DIR/active.json"
      - name: Deploy candidate with zero production traffic
        id: rollout
        run: |
          set -euo pipefail
          DEPLOY_SHA='${{ github.event.workflow_run.head_sha || github.sha }}'
          TAG="candidate-${DEPLOY_SHA:0:12}"
          BEFORE="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json)"
          PREVIOUS_REVISION="$(jq -r '.status.traffic[] | select(.percent == 100) | .revisionName' <<<"$BEFORE" | head -n1)"
          test -n "$PREVIOUS_REVISION"
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image='${{ steps.image.outputs.uri }}' \
            --service-account="$RUNTIME_SA" \
            --ingress=all --allow-unauthenticated \
            --cpu=1 --memory=512Mi --concurrency=8 --timeout=30s \
            --min-instances=1 --max-instances=1 \
            --no-traffic --tag="$TAG" \
            --add-cloudsql-instances="$CLOUD_SQL_INSTANCE" \
            --set-env-vars=NWS_ENVIRONMENT=production,NWS_REQUIRE_API_KEY=true,NWS_DATA_MODE=NATIONAL_PUBLIC_PROFESSIONAL_SNAPSHOT,NWS_NATIONAL_SOURCES_ENABLED=true,NWS_SEC_SOURCE_ENABLED=true,NWS_SEC_API_BASE_URL=https://insider-holdings-api-fro3hygenq-uc.a.run.app,NWS_FORM6_SOURCE_ENABLED=true,NWS_SNAPSHOT_BUCKET=${SNAPSHOT_BUCKET},NWS_SNAPSHOT_PREFIX=${SNAPSHOT_PREFIX},NWS_SNAPSHOT_MAX_AGE_HOURS=24,NWS_SNAPSHOT_MAX_SOURCE_AGE_HOURS=720,NWS_SOURCE_REGISTRY_PATH=${SOURCE_REGISTRY_PATH},NWS_SOURCE_REGISTRY_MANIFEST_PATH=${SOURCE_REGISTRY_MANIFEST_PATH},NWS_SOURCE_REGISTRY_SHA256=${SOURCE_REGISTRY_SHA256},NWS_SOURCE_REGISTRY_VERSION=${SOURCE_REGISTRY_VERSION},NWS_V4_ENABLED=true,NWS_CONSUMER_REGISTRY_SHA256=${CONSUMER_REGISTRY_SHA256},NWS_CONSENT_RECEIPT_BUCKET=${CONSENT_RECEIPT_BUCKET},NWS_NPPES_SOURCE_ENABLED=true,NWS_NPPES_DB_HOST=/cloudsql/hushh-tech-prod:us-central1:hushh-directories-db,NWS_NPPES_DB_PORT=5432,NWS_NPPES_DB_NAME=healthcare,NWS_NPPES_DB_USER=nws_nearby_ro,NWS_NPPES_STATEMENT_TIMEOUT_MS=4000,NWS_RATE_LIMIT_PER_MINUTE=60,NWS_MAX_REQUEST_BYTES=32768,NWS_QUERY_LOCATION_DECIMALS=2 \
            --remove-secrets=NWS_FORM6_API_KEY \
            --update-secrets="NWS_API_KEY=${SECRET_NAME}:${NWS_API_KEY_SECRET_VERSION},NWS_CONSUMER_REGISTRY_JSON=${CONSUMER_REGISTRY_SECRET_NAME}:${CONSUMER_REGISTRY_SECRET_VERSION},NWS_SEC_API_KEY=${PROFESSIONAL_SECRET_NAME}:${PROFESSIONAL_API_KEY_SECRET_VERSION},NWS_NPPES_DB_PASSWORD=${NPPES_DB_SECRET_NAME}:${NPPES_DB_PASSWORD_SECRET_VERSION}" \
            --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=6 \
            --liveness-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=10,failureThreshold=3
          AFTER="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json)"
          CANDIDATE_REVISION="$(jq -r --arg TAG "$TAG" '.status.traffic[] | select(.tag == $TAG) | .revisionName' <<<"$AFTER")"
          CANDIDATE_URL="$(jq -r --arg TAG "$TAG" '.status.traffic[] | select(.tag == $TAG) | .url' <<<"$AFTER")"
          test -n "$CANDIDATE_REVISION"
          test -n "$CANDIDATE_URL"
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
      - name: Verify candidate national sources before promotion
        run: |
          set -euo pipefail
          URL='${{ steps.rollout.outputs.candidate_url }}'
          SMOKE_KEY="$(gcloud secrets versions access "$NWS_API_KEY_SECRET_VERSION" --secret="$SECRET_NAME" --project="$PROJECT_ID")"
          echo "::add-mask::$SMOKE_KEY"
          curl --fail-with-body --retry 5 --retry-all-errors "$URL/health" >/dev/null
          READY="$(curl --fail-with-body --retry 5 --retry-all-errors "$URL/ready")"
          jq -e \
            --arg snapshot_id '${{ steps.snapshot.outputs.id }}' \
            --arg snapshot_sha256 '${{ steps.snapshot.outputs.sha256 }}' \
            --arg consumer_registry_version "$CONSUMER_REGISTRY_EXPECTED_VERSION" \
            --arg consumer_count "$CONSUMER_REGISTRY_EXPECTED_CONSUMERS" '
            .status == "ok" and
            .geography_record_count == 33791 and
            .public_jurisdiction_record_count == 33791 and
            .national_sources_enabled == true and
            .form6_source_enabled == true and
            .v4_enabled == true and
            .consumer_registry_version == ($consumer_registry_version | tonumber) and
            .consumer_count == ($consumer_count | tonumber) and
            .net_worth_snapshot_id == $snapshot_id and
            .net_worth_snapshot_sha256 == $snapshot_sha256 and
            .net_worth_model_version == "net-worth-v1.0.0" and
            .nws_scale_version == "nws-fixed-us-log-v1.0.0"
          ' <<<"$READY" >/dev/null
          BODY="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $SMOKE_KEY" \
            -d '{"query":{"postal_code":"60637"},"top_n":60,"initial_radius_km":20,"max_radius_km":25}' \
            "$URL/v2/nearby-network/discover")"
          jq -e '
            .coverage.status == "COVERED" and
            .coverage.data_mode == "NATIONAL_PUBLIC_PROFESSIONAL_SNAPSHOT" and
            (.results | length) == 60 and
            any(.source_status[]; .source == "CMS_NPPES" and .status == "OK") and
            any(.source_status[]; .source == "SEC_SECTION16" and .status == "OK")
          ' <<<"$BODY" >/dev/null
          jq '{coverage:.coverage.status,returned:(.results|length),sources:[.source_status[]|{source,status}]}' <<<"$BODY"
          NET_WORTH_BODY="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $SMOKE_KEY" \
            -d '{"query":{"postal_code":"33130"},"top_n":1}' \
            "$URL/v3/nearby-net-worth/discover")"
          jq -e '
            .coverage.status == "COVERED" and
            .snapshot.score_kind == "NET_WORTH_SCORE" and
            .financial_coverage.status == "PARTIAL" and
            (.results | length) == 1 and
            .results[0].nws.status == "AVAILABLE" and
            .results[0].estimated_net_worth.method == "DECLARED_TOTAL_SIMULATION" and
            .results[0].components.liabilities.status == "INCLUDED_IN_DECLARED_TOTAL" and
            any(.source_status[]; .source == "FLORIDA_FORM_6_DECLARED_TOTALS" and .status == "OK")
          ' <<<"$NET_WORTH_BODY" >/dev/null
          jq '{financialCoverage:.financial_coverage.status,returned:(.results|length),scoreKind:.snapshot.score_kind}' <<<"$NET_WORTH_BODY"
          V4_KEY="$(gcloud secrets versions access "$V4_API_KEY_SECRET_VERSION" \
            --secret="$V4_API_KEY_SECRET_NAME" --project="$PROJECT_ID")"
          echo "::add-mask::$V4_KEY"
          V4_BODY="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $V4_KEY" \
            -d '{"query":{"postal_code":"33130","country_code":"US"},"selection":{"count":100,"financial_mode":"estimated","geography_mode":"nearest-count"},"filters":{"minimum_confidence":"C","minimum_coverage":0.55,"asset_families":[]},"caller_context":{"project_id":"hushone-app","purpose_id":"NET_WORTH_LOOKUP","authorization_scope":"PUBLIC_SAFE","requested_data_tier":"PUBLIC_SAFE","audit_actor":"service-account:nws-production-smoke","model_version":"net-worth-v1.0.0"}}' \
            "$URL/v4/net-worth/discover")"
          jq -e '
            .contract_version == "nws-nearby-net-worth-v4-preview-1" and
            .data_tier == "PUBLIC_SAFE" and
            .request_policy.project_id == "hushone-app" and
            .result_set.requested_count == 100 and
            .result_set.shortfall_count == (100 - .result_set.returned_count) and
            (.results | length) == .result_set.returned_count and
            (.results | length) > 0 and
            all(.results[]; (.confidence.grade == "A" or .confidence.grade == "B" or .confidence.grade == "C")) and
            (.disclosures | index("FINANCIAL_COVERAGE_NOT_NATIONWIDE")) != null
          ' <<<"$V4_BODY" >/dev/null
          CONSENT="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $V4_KEY" \
            -d '{"project_id":"hushone-app","purpose_id":"NET_WORTH_LOOKUP","audit_actor":"service-account:nws-production-smoke","scope":"APPROXIMATE_LOCATION_QUERY","consent_granted":true}' \
            "$URL/v4/location-consent/receipt")"
          COORDINATE_REQUEST="$(jq -cn --argjson consent "$CONSENT" '{query:{latitude:25.7617,longitude:-80.1918,country_code:"US"},selection:{count:100,financial_mode:"estimated",geography_mode:"nearest-count"},filters:{minimum_confidence:"C",minimum_coverage:0.55,asset_families:[]},caller_context:{project_id:"hushone-app",purpose_id:"NET_WORTH_LOOKUP",authorization_scope:"PUBLIC_SAFE",requested_data_tier:"PUBLIC_SAFE",audit_actor:"service-account:nws-production-smoke",model_version:"net-worth-v1.0.0"},coordinate_consent:$consent}')"
          COORDINATE_BODY="$(curl --fail-with-body \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $V4_KEY" \
            -d "$COORDINATE_REQUEST" "$URL/v4/net-worth/discover")"
          jq -e '
            .query.mode == "COARSE_COORDINATE" and
            .data_tier == "PUBLIC_SAFE" and
            (.results | length) == .result_set.returned_count
          ' <<<"$COORDINATE_BODY" >/dev/null
          REPLAY_BODY="$(mktemp)"
          REPLAY_STATUS="$(curl --silent --output "$REPLAY_BODY" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $V4_KEY" \
            -d "$COORDINATE_REQUEST" "$URL/v4/net-worth/discover")"
          test "$REPLAY_STATUS" = 403
          jq -e '.detail.code == "INVALID_COORDINATE_CONSENT"' "$REPLAY_BODY" >/dev/null
          rm -f "$REPLAY_BODY"
      - name: Promote candidate and retain automatic rollback
        run: |
          set -euo pipefail
          PREVIOUS='${{ steps.rollout.outputs.previous_revision }}'
          CANDIDATE='${{ steps.rollout.outputs.candidate_revision }}'
          rollback() {
            gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
              --to-revisions="$PREVIOUS=100" --quiet
          }
          trap rollback ERR
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --to-revisions="$CANDIDATE=100" --quiet
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          curl --fail-with-body --retry 5 --retry-all-errors "$URL/health" >/dev/null
          LIVE_READY="$(curl --fail-with-body --retry 5 --retry-all-errors "$URL/ready")"
          jq -e \
            --arg snapshot_id '${{ steps.snapshot.outputs.id }}' \
            --arg snapshot_sha256 '${{ steps.snapshot.outputs.sha256 }}' '
            .status == "ok" and
            .net_worth_snapshot_id == $snapshot_id and
            .net_worth_snapshot_sha256 == $snapshot_sha256
          ' <<<"$LIVE_READY" >/dev/null
          SMOKE_KEY="$(gcloud secrets versions access "$NWS_API_KEY_SECRET_VERSION" --secret="$SECRET_NAME" --project="$PROJECT_ID")"
          echo "::add-mask::$SMOKE_KEY"
          LIVE_BODY="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $SMOKE_KEY" \
            -d '{"query":{"postal_code":"60637"},"top_n":60,"initial_radius_km":20,"max_radius_km":25}' \
            "$URL/v2/nearby-network/discover")"
          jq -e '.coverage.status == "COVERED" and (.results | length) == 60' <<<"$LIVE_BODY" >/dev/null
          LIVE_NET_WORTH="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $SMOKE_KEY" \
            -d '{"query":{"postal_code":"33130"},"top_n":1}' \
            "$URL/v3/nearby-net-worth/discover")"
          jq -e '
            .snapshot.score_kind == "NET_WORTH_SCORE" and
            (.results | length) == 1 and
            .results[0].nws.status == "AVAILABLE"
          ' <<<"$LIVE_NET_WORTH" >/dev/null
          LIVE_V4_KEY="$(gcloud secrets versions access "$V4_API_KEY_SECRET_VERSION" \
            --secret="$V4_API_KEY_SECRET_NAME" --project="$PROJECT_ID")"
          echo "::add-mask::$LIVE_V4_KEY"
          LIVE_V4="$(curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-NWS-API-Key: $LIVE_V4_KEY" \
            -d '{"query":{"postal_code":"33130","country_code":"US"},"selection":{"count":100,"financial_mode":"verified","geography_mode":"nearest-count"},"filters":{"minimum_confidence":"B","minimum_coverage":0.7,"asset_families":[]},"caller_context":{"project_id":"hushone-app","purpose_id":"NET_WORTH_LOOKUP","authorization_scope":"PUBLIC_SAFE","requested_data_tier":"PUBLIC_SAFE","audit_actor":"service-account:nws-production-smoke","model_version":"net-worth-v1.0.0"}}' \
            "$URL/v4/net-worth/discover")"
          jq -e '
            .contract_version == "nws-nearby-net-worth-v4-preview-1" and
            .request_policy.financial_mode == "verified" and
            .result_set.returned_count > 0 and
            all(.results[]; (.confidence.grade == "A" or .confidence.grade == "B"))
          ' <<<"$LIVE_V4" >/dev/null
          LIVE_REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format=json | jq -r '.status.traffic[] | select(.percent == 100) | .revisionName')"
          test "$LIVE_REVISION" = "$CANDIDATE"
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --clear-tags --quiet
          trap - ERR
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='json(status.latestReadyRevisionName,status.traffic,spec.template.spec.serviceAccountName)'
