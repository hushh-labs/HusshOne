# GCP-native CD: on push to main, Cloud Build gates → builds the image → deploys to Cloud Run
# (service `one` / project hushone-app / region us-central1 — served publicly at intelligence.hushh.ai) →
# prod smoke. Runs as 53407187172-compute@developer (already has run.admin + iam.serviceAccountUser
# + artifactregistry.writer). This is independent of GitHub Actions billing.
#
# Deploy target is the `one` service in hushone-app ONLY. Do NOT point this at one-hushh-ai /
# hushh-tech-prod — that deploy "succeeds" but this public site never changes.
# Domain note: the canonical public domain for THIS service is intelligence.hushh.ai (verified via
# `gcloud run domain-mappings list`). one.hushh.ai is a SEPARATE service (project hushh-pda) and
# 404s for this app's routes — so the health gate below must probe intelligence.hushh.ai, never one.hushh.ai.

substitutions:
  _SERVICE: one
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/one

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  # 1) Gate — install, type-check, and run the full unit suite. Fails the deploy fast on a red build
  #    BEFORE the slower image build, so a broken main never reaches prod.
  - id: gate
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npx tsc --noEmit
        npx vitest run

  # 2) Build the production image from the repo Dockerfile (this also runs `next build`).
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "."]

  # 3) Push so the Cloud Run deploy can reference the freshly-built image.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  # 4) Deploy to the correct service. --image only updates the image; env, secrets, scaling, and the
  #    ≥900s request timeout already on the service are preserved.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --quiet

  # 5) Health gate — full E2E probe (intelligence.hushh.ai is direct/no-CDN, so the new revision is live now).
  #    The harness checks the public shell + /api/internal/health (DB, Vertex, Deep Research API, scrapers)
  #    and exits non-zero only when a CRITICAL dep is down — so a deploy fails on a real outage, but a
  #    degraded scraper (e.g. Threads logged out) does NOT block the ship.
  - id: health-gate
    name: node:20
    entrypoint: bash
    secretEnv: ["ONE_INTERNAL_JOB_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        BASE_URL=https://intelligence.hushh.ai node scripts/health-e2e.mjs

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/ONE_INTERNAL_JOB_TOKEN/versions/latest
      env: ONE_INTERNAL_JOB_TOKEN
