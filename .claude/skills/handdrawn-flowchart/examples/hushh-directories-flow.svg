<path class="ln" d="M378 730 C 232 784, 66 792, 34 700 C 14 560, 14 430, 24 330 C 30 288, 44 274, 60 268" stroke="#e2913c" stroke-width="4.5" marker-end="url(#ha)" filter="url(#rough2)"/>
