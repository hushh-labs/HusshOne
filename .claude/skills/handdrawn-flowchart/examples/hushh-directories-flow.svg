<svg width="100%" viewBox="0 0 680 1010" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Hand-drawn flow: how the Hushh Directories engine runs 24x7</title>
<desc>A whiteboard-style sketch in four numbered steps. Header: Hushh Directories, a 24x7 machine that collects data and mails you every hour, roughly 5.5 million records. Step 1: five colour-coded 24x7 worker services, each with a live count — Hotels 42.6k (teal), Health 5.20M (maroon), RIA 88.0k (orange), Insure 144.8k (indigo), Social graph (green). Step 2: fetch the data — hotels crawl OpenStreetMap plus Google Places ZIP by ZIP from Kirkland outward, while Health pulls the NPPES file, RIA the SEC Form ADV feed and Insure the Texas DOI feed as official bulk files. Step 3: geo-link each row (ZIP to lat/long, a PostGIS point) then save into one Cloud SQL plus PostGIS instance holding five deduped databases, with a big REPEAT 24x7 loop that resumes after any restart. Step 4: one combined email goes out every hour at nine past to ankit, manish and kushal; and a social who-knows-who graph is built over the four databases. Footer: restarts itself, resumes from the database, self-refreshing, never duplicates.</desc>
<defs>
<filter id="rs" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" result="d"/>
  <feDropShadow in="d" dx="1.3" dy="2.2" stdDeviation="1.4" flood-color="#000" flood-opacity="0.13"/>
</filter>
<filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
  <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
</filter>
<filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
  <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
</filter>
<marker id="ha" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M1 1 L11 6 L1 11" fill="none" stroke="context-stroke" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="1010" fill="#ffffff"/>
<style>
.hb{font-family:'Comic Sans MS','Chalkboard SE','Bradley Hand',cursive;font-weight:700;fill:#1c1c1c}
.h{font-family:'Comic Sans MS','Chalkboard SE','Bradley Hand',cursive;font-weight:400;fill:#1c1c1c}
.ln{stroke:#1c1c1c;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#1c1c1c;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.win{fill:#c3c7ca}
.wt{fill:#ffffff}
</style>

<!-- ===== TITLE BAND ===== -->
<g filter="url(#rs)"><rect x="28" y="18" width="624" height="96" rx="14" fill="#eef6f5"/></g>
<text class="hb" x="50" y="70" font-size="40">HUSHH DIRECTORIES</text>
<path class="ln" d="M52 80 C 180 74, 340 84, 470 78" stroke="#3f9c96" stroke-width="4" filter="url(#rough)"/>
<text class="h" x="52" y="102" font-size="17">a 24×7 machine that collects data &amp; mails you every hour</text>
<g filter="url(#rs)"><circle cx="600" cy="66" r="42" fill="#ffffff"/><circle class="ln" cx="600" cy="66" r="42" fill="none" stroke="#3f9c96" stroke-width="2.6"/></g>
<text class="hb" x="600" y="60" font-size="20" fill="#3f9c96" text-anchor="middle">≈5.5M</text>
<text class="h" x="600" y="80" font-size="12" text-anchor="middle">records · live</text>

<!-- ===== STEP 1 : WORKERS ===== -->
<text class="hb" x="40" y="150" font-size="21" fill="#3f9c96">[ STEP 1 · FIVE 24×7 WORKERS ]</text>

<!-- building 1 HOTELS teal -->
