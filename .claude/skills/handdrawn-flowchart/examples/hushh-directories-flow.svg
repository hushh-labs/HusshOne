  <rect x="310" y="168" width="76" height="12" fill="#e2913c"/>
  <rect class="ln" x="310" y="180" width="76" height="86" fill="#e9ecee"/>
  <rect class="win" x="322" y="194" width="20" height="14"/><rect class="win" x="354" y="194" width="20" height="14"/>
  <rect class="win" x="322" y="216" width="20" height="14"/><rect class="win" x="354" y="216" width="20" height="14"/>
  <rect class="win" x="322" y="238" width="20" height="14"/><rect class="win" x="354" y="238" width="20" height="14"/>
</g>
<text class="hb" x="348" y="286" font-size="14" text-anchor="middle">RIA</text>
<g filter="url(#rs)"><rect x="318" y="294" width="60" height="21" rx="10" fill="#e2913c"/></g>
<text class="hb wt" x="348" y="309" font-size="12" text-anchor="middle">88.0k</text>

<!-- building 4 INSURE indigo -->
<g filter="url(#rs)">
  <rect x="434" y="168" width="76" height="12" fill="#5b6f9c"/>
  <rect class="ln" x="434" y="180" width="76" height="86" fill="#e9ecee"/>
  <rect class="win" x="446" y="194" width="20" height="14"/><rect class="win" x="478" y="194" width="20" height="14"/>
  <rect class="win" x="446" y="216" width="20" height="14"/><rect class="win" x="478" y="216" width="20" height="14"/>
  <rect class="win" x="446" y="238" width="20" height="14"/><rect class="win" x="478" y="238" width="20" height="14"/>
</g>
<text class="hb" x="472" y="286" font-size="14" text-anchor="middle">INSURE</text>
<g filter="url(#rs)"><rect x="442" y="294" width="60" height="21" rx="10" fill="#5b6f9c"/></g>
<text class="hb wt" x="472" y="309" font-size="12" text-anchor="middle">144.8k</text>

<!-- building 5 SOCIAL green -->
<g filter="url(#rs)">
  <rect x="558" y="168" width="76" height="12" fill="#6f9c5b"/>
  <rect class="ln" x="558" y="180" width="76" height="86" fill="#e9ecee"/>
  <rect class="win" x="570" y="194" width="20" height="14"/><rect class="win" x="602" y="194" width="20" height="14"/>
  <rect class="win" x="570" y="216" width="20" height="14"/><rect class="win" x="602" y="216" width="20" height="14"/>
  <rect class="win" x="570" y="238" width="20" height="14"/><rect class="win" x="602" y="238" width="20" height="14"/>
</g>
<text class="hb" x="596" y="286" font-size="14" text-anchor="middle">SOCIAL</text>
<g filter="url(#rs)"><rect x="566" y="294" width="60" height="21" rx="10" fill="#6f9c5b"/></g>
<text class="hb wt" x="596" y="309" font-size="12" text-anchor="middle">graph</text>

<text class="h" x="340" y="340" font-size="14" text-anchor="middle">each worker loops forever — pick next target · fetch · save · never stops</text>

<!-- flow arrow 1 -->
<path class="ln" d="M340 350 C 334 366, 346 376, 340 394" stroke="#e2913c" stroke-width="5" marker-end="url(#ha)" filter="url(#rough)"/>

<!-- ===== STEP 2 : FETCH ===== -->
