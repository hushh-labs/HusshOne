<circle cx="470" cy="507" r="5" fill="#5b6f9c"/><text class="hb" x="482" y="512" font-size="12">TX DOI feed → INSURE</text>
<text class="h" x="546" y="538" font-size="12" text-anchor="middle">official bulk files · whole file each pass</text>

<!-- flow arrow 2 -->
<path class="ln" d="M340 548 C 334 564, 346 574, 340 592" stroke="#3f9c96" stroke-width="5" marker-end="url(#ha)" filter="url(#rough)"/>

