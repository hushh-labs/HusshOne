<g filter="url(#rs)"><rect x="356" y="758" width="52" height="18" rx="9" fill="#3f9c96"/></g><text class="hb wt" x="382" y="771">hotels</text>
<g filter="url(#rs)"><rect x="412" y="758" width="52" height="18" rx="9" fill="#b46360"/></g><text class="hb wt" x="438" y="771">health</text>
