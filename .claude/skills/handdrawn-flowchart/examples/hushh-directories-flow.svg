<circle cx="132" cy="512" r="5" fill="#3f9c96"/>
<text class="h" x="144" y="517" font-size="13">→ HOTELS (live crawl, ZIP-by-ZIP from Kirkland)</text>

<!-- national bulk files (health / ria / insure) -->
