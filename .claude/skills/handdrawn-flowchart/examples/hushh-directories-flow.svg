  <rect x="62" y="168" width="76" height="12" fill="#3f9c96"/>
  <rect class="ln" x="62" y="180" width="76" height="86" fill="#e9ecee"/>
  <rect class="win" x="74" y="194" width="20" height="14"/><rect class="win" x="106" y="194" width="20" height="14"/>
  <rect class="win" x="74" y="216" width="20" height="14"/><rect class="win" x="106" y="216" width="20" height="14"/>
