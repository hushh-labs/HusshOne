  <rect class="ln" x="186" y="180" width="76" height="86" fill="#e9ecee"/>
  <rect class="win" x="198" y="194" width="20" height="14"/><rect class="win" x="230" y="194" width="20" height="14"/>
  <rect class="win" x="198" y="216" width="20" height="14"/><rect class="win" x="230" y="216" width="20" height="14"/>
  <rect class="win" x="198" y="238" width="20" height="14"/><rect class="win" x="230" y="238" width="20" height="14"/>
</g>
<text class="hb" x="224" y="286" font-size="14" text-anchor="middle">HEALTH</text>
<g filter="url(#rs)"><rect x="194" y="294" width="60" height="21" rx="10" fill="#b46360"/></g>
<text class="hb wt" x="224" y="309" font-size="12" text-anchor="middle">5.20M</text>

<!-- building 3 RIA orange -->
