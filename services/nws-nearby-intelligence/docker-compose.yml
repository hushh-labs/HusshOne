# Development/reference stack only. It is intentionally excluded from the
# production Cloud Run image; never deploy its sample credentials or `latest`
# image tags.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nwsintel
      POSTGRES_USER: nwsintel
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwsintel -d nwsintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  api:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://nwsintel:local-development-only@postgres:5432/nwsintel
      NWS_CANDIDATE_BACKEND: demo
      NWS_DEMO_CANDIDATE_COUNT: "520"
    command: >-
      sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8080"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
