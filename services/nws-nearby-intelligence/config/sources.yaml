version: 3
registry_id: nws-nearby-source-registry
product: nws_nearby
source_contract_defaults:
  enabled: false
  kill_switch: true
  publication_mode: NO_DIRECT_PUBLICATION
  immutable_artifacts: true
  sha256_required: true
  parser_version_required: true
  no_authentication_bypass: true
  no_captcha_bypass: true
  no_private_pages: true
  no_personal_contact_enrichment: true

sources:
  census_gazetteer_zcta:
    authority: U.S. Census Bureau
    acquisition: annual_bulk_zip
    trust_tier: authoritative
    cadence: annual
    allowed_fact_types: [postal_centroid, postal_boundary, place_label]
    purpose: Resolve ZIP/ZCTA queries to representative public geography.

  census_tiger_places:
    authority: U.S. Census Bureau
    acquisition: annual_bulk_shapefile
    trust_tier: authoritative
    cadence: annual
    allowed_fact_types: [city_boundary, metro_boundary, geographic_crosswalk]

  florida_form_6:
    authority: Florida Commission on Ethics
    acquisition: reviewed_snapshot
    trust_tier: authoritative
    cadence: annual_reviewed_release
    enabled: true
    kill_switch: false
    publication_mode: REVIEWED_SNAPSHOT_ONLY
    allowed_operations: [SNAPSHOT_PUBLISHER, QUERY]
    allowed_products: [NET_WORTH_V3]
    allowed_purposes: [FINANCIAL_EVIDENCE]
    allowed_fact_types:
      - sworn_whole_declared_net_worth
      - public_name
      - public_office
      - public_service_jurisdiction
      - form_year
      - filing_provenance
    forbidden_fact_types:
      - asset_schedule
      - liability_schedule
      - income_schedule
      - private_residence
      - street_address
      - personal_contact
      - raw_pdf_publication
      - component_addition
      - eligibility_or_adverse_decision
    active_snapshot:
      snapshot_id: florida-form6-2025-20260811T184624Z-partial
      sha256: d1a20016a18cdc474e8dccc062d7cdccc6a4107a963cb96f8d0e9484702522ad
      review_status: APPROVED
      reviewed_at: "2026-08-14"
      built_at: "2026-08-11T18:46:24.202Z"
      form_year: 2025
      partial: true
      filings_seen: 120
      declarations_indexed: 120
    extraction_contract:
      pdf_content_type: application/pdf
      maximum_pdf_bytes: 10485760
      text_pages: [1]
      emitted_fields: [net_worth]
      maximum_field_window_characters: 256
      raw_pdf_retention: EPHEMERAL_DELETE_IN_FINALLY
      schedule_retention: FORBIDDEN
      schedule_emission: FORBIDDEN
    source_url: https://disclosure.floridaethics.gov/PublicSearch/Filings
    policy: Sworn whole-declaration evidence only. Do not add components, infer residence, republish filing schedules, or use this source for eligibility or adverse decisions.
    source_family: disclosure.floridaethics.gov
    candidate_proposal_mode: REVIEW_REQUIRED

  sec_edgar_ownership:
    authority: U.S. Securities and Exchange Commission
    acquisition: daily_indexes_and_filing_archives
    trust_tier: authoritative
    cadence: intraday_and_nightly
    forms: ["3", "3/A", "4", "4/A", "5", "5/A", "13D", "13D/A", "13G", "13G/A"]
    allowed_fact_types: [public_role, director_role, issuer_relationship, beneficial_ownership, capital_access]
    forbidden_fact_types: [private_residence, family_relationship]
    graph_edges:
      REPORTING_OWNER_OF: 0.85
      DIRECTOR_OF: 0.90
      OFFICER_OF: 0.85
    source_family: sec.gov
    candidate_proposal_mode: REVIEW_REQUIRED

  sec_form_d:
    authority: U.S. Securities and Exchange Commission
    acquisition: filing_archives
    trust_tier: authoritative
    cadence: daily
    forms: ["D", "D/A"]
    allowed_fact_types: [issuer_identity, issuer_offering_filing, organization_relationship]
    forbidden_fact_types:
      - offering_amount_as_personal_wealth
      - private_residence
      - investor_identity_inference
      - direct_score_input
    policy: Discovery of issuer and official-source relationships only; a Form D offering is not a person's wealth, address, or local-presence signal.
    source_family: sec.gov
    candidate_proposal_mode: DISCOVERY_ONLY

  sec_iapd_adv:
    authority: U.S. Securities and Exchange Commission / Investment Adviser Public Disclosure
    acquisition: public_bulk_or_filing_archive
    trust_tier: authoritative
    cadence: release_driven
    allowed_fact_types: [adviser_firm_identity, adviser_business_role, firm_office_location, control_person_role]
    forbidden_fact_types:
      - aum_as_personal_wealth
      - client_information
      - private_residence
      - direct_score_input
    policy: Firm and licensed-role verification only; firm AUM, client counts, and control roles are not personal financial-capacity claims.
    source_family: iapd.sec.gov
    candidate_proposal_mode: REVIEW_REQUIRED

  sec_proxy_and_company_filings:
    authority: U.S. Securities and Exchange Commission
    acquisition: filing_archives
    trust_tier: authoritative
    cadence: daily
    forms: ["DEF 14A", "10-K", "8-K", "S-1", "S-1/A"]
    allowed_fact_types: [executive_role, board_role, founder_history, company_event, compensation_context]
    forbidden_fact_types: [personal_net_worth_from_compensation]

  irs_990_xml:
    authority: Internal Revenue Service
    acquisition: monthly_bulk_xml
    trust_tier: authoritative
    cadence: monthly
    allowed_fact_types: [nonprofit_officer, trustee_role, organization_scale, grantmaking_context]
    forbidden_fact_types: [personal_net_worth, donor_identity_where_not_public]
    graph_edges:
      OFFICER_OF_NONPROFIT: 0.65
      TRUSTEE_OF: 0.70

  uspto_patentsview_bulk:
    authority: U.S. Patent and Trademark Office Open Data Portal
    acquisition: bulk_tables
    trust_tier: authoritative
    cadence: release_driven
    allowed_fact_types: [inventor, patent, assignee, coinventor]
    graph_edges:
      INVENTED: 0.55
      COINVENTED_WITH: 0.42
      ASSIGNED_TO: 0.45

  openalex_snapshot:
    authority: OpenAlex
    acquisition: quarterly_snapshot_parquet
    trust_tier: primary
    cadence: quarterly
    allowed_fact_types: [author, work, institution, coauthor, citation_count, concept]
    graph_edges:
      AUTHORED: 0.45
      COAUTHORED_WITH: 0.34
      AFFILIATED_WITH: 0.48

  wikidata_dump:
    authority: Wikimedia Foundation community data
    acquisition: json_or_rdf_dump
    trust_tier: corroborative
    cadence: weekly_or_monthly
    allowed_fact_types: [identity_alias, occupation, organization_relation, official_website, city_level_affiliation]
    forbidden_fact_types: [unreferenced_wealth, unreferenced_residence]
    policy: Discovery and corroboration only; material facts require a primary source.
    source_family: wikidata.org
    candidate_proposal_mode: DISCOVERY_ONLY

  common_crawl:
    authority: Common Crawl
    acquisition: WARC_WAT_WET_and_index
    trust_tier: discovery_only
    cadence: monthly
    allowed_fact_types: [source_discovery, public_page_history, official_domain_candidate]
    forbidden_fact_types: [direct_identity_merge, direct_score_input, private_residence]
    policy: Extract URLs and claims, then corroborate against primary sources.
    source_family: commoncrawl.org
    candidate_proposal_mode: DISCOVERY_ONLY

  local_business_directory_discovery:
    authority: Public chamber, business, or professional directory
    acquisition: respectful_public_crawl
    trust_tier: discovery_only
    cadence: monthly
    allowed_fact_types: [source_discovery, official_domain_candidate, organization_identity]
    forbidden_fact_types:
      - direct_identity_merge
      - direct_candidate_publication
      - direct_score_input
      - personal_contact_enrichment
      - private_residence
    policy: Find organization anchors and official pages only. Directory entries cannot independently establish a person's current role or local association.
    source_family: local-directory
    candidate_proposal_mode: DISCOVERY_ONLY

  official_company_pages:
    authority: Issuer or organization
    acquisition: respectful_public_crawl
    trust_tier: primary
    cadence: weekly
    allowed_fact_types: [identity_alias, organization_identity, current_role, founder_role, board_role, office_location, public_bio, official_profile_link]
    forbidden_fact_types: [personal_net_worth, private_residence, family_graph]
    crawl_policy:
      obey_robots_txt: true
      declared_user_agent: true
      centralized_rate_limit: true
    source_family: official-organization-domain
    candidate_proposal_mode: REVIEW_REQUIRED

  official_fund_and_portfolio_pages:
    authority: Investment firm or portfolio company
    acquisition: respectful_public_crawl
    trust_tier: primary
    cadence: weekly
    allowed_fact_types: [identity_alias, organization_identity, current_role, official_profile_link, office_location, partner_role, investor_role, portfolio_relationship, public_office_location]
    graph_edges:
      PARTNER_AT: 0.86
      PUBLICLY_INVESTED_IN: 0.62
    source_family: official-fund-domain
    candidate_proposal_mode: REVIEW_REQUIRED

  state_business_registries:
    authority: State secretary of state or corporations division
    acquisition: public_bulk_or_public_search
    trust_tier: authoritative_for_filing_fact
    cadence: weekly
    allowed_fact_types: [entity_existence, filing_role, formation_date, public_business_location]
    forbidden_fact_types: [economic_ownership_without_support, registered_agent_as_owner]
    source_family: state-corporations-registry
    candidate_proposal_mode: DISCOVERY_ONLY

  official_government_directories:
    authority: Federal, state, county, or municipal government
    acquisition: public_bulk_or_respectful_crawl
    trust_tier: authoritative
    cadence: weekly
    allowed_fact_types: [identity_alias, organization_identity, current_role, official_profile_link, office_location, public_official_role, agency_leadership, public_service_jurisdiction, official_bio]
    forbidden_fact_types: [political_affiliation_inference, personal_contact_enrichment]
    source_family: official-government-domain
    candidate_proposal_mode: REVIEW_REQUIRED

  university_and_research_bios:
    authority: Accredited university or research institution
    acquisition: respectful_public_crawl
    trust_tier: primary
    cadence: monthly
    allowed_fact_types: [identity_alias, organization_identity, current_role, official_profile_link, office_location, faculty_role, lab_leadership, public_bio, institution_location, awards]
    source_family: official-institution-domain
    candidate_proposal_mode: REVIEW_REQUIRED

  public_event_agendas:
    authority: Event organizer or host institution
    acquisition: public_page_or_pdf
    trust_tier: corroborative
    cadence: weekly
    allowed_fact_types: [speaker_role, panel_role, public_topic]
    forbidden_fact_types: [stable_local_affiliation_from_single_event]
    graph_edges:
      SPOKE_AT: 0.18
    source_family: official-event-organizer
    candidate_proposal_mode: DISCOVERY_ONLY

  official_press_releases:
    authority: Company, government, university, or nonprofit
    acquisition: public_rss_and_respectful_crawl
    trust_tier: primary
    cadence: daily
    allowed_fact_types: [identity_alias, organization_identity, current_role, official_profile_link, office_location, appointment, funding_event, acquisition, award, board_change, public_partnership]
    source_family: official-organization-domain
    candidate_proposal_mode: REVIEW_REQUIRED

  github_public_claimed_profiles:
    authority: Public GitHub profile and repository metadata
    acquisition: public_pages_or_approved_bulk_archive
    trust_tier: corroborative
    cadence: weekly
    allowed_fact_types: [claimed_identity_link, open_source_maintainership, repository_collaboration]
    forbidden_fact_types: [location_inference_from_commit_timestamps, private_repository_data]
    graph_edges:
      MAINTAINS: 0.32
      COLLABORATED_WITH: 0.18
    source_family: github.com
    candidate_proposal_mode: DISCOVERY_ONLY

  public_social_verified:
    authority: Public verified or officially linked social profile
    acquisition: public_page_only
    trust_tier: corroborative
    cadence: weekly
    enabled: false
    kill_switch: true
    publication_mode: DISCOVERY_ONLY_NO_FINANCIAL_OUTPUT
    allowed_fact_types: [identity_link, official_role_claim, official_website_link, bounded_public_reach]
    forbidden_fact_types:
      - wealth
      - private_residence
      - family_graph
      - lifestyle_asset_inference
      - face_recognition
      - checkin_history
      - financial_evidence
      - net_worth
      - direct_score_input
    policy: Disabled. Social scraper infrastructure, authenticated sessions, engagement metrics, and inferred lifestyle signals cannot publish financial evidence or contribute to a net-worth score.
    source_family: verified-public-social
    candidate_proposal_mode: DISCOVERY_ONLY

  usaspending_awards:
    authority: USAspending.gov
    acquisition: public_api_or_bulk_download
    trust_tier: authoritative
    cadence: daily
    allowed_fact_types: [awardee_organization_identity, public_award, organization_activity]
    forbidden_fact_types:
      - award_amount_as_personal_wealth
      - personal_residence
      - direct_candidate_publication
      - direct_score_input
    policy: Organization discovery and public activity context only; award amounts do not establish a person's wealth or current role.
    source_family: usaspending.gov
    candidate_proposal_mode: DISCOVERY_ONLY

  sbir_awards:
    authority: SBIR.gov
    acquisition: public_api_or_bulk_download
    trust_tier: authoritative
    cadence: release_driven
    allowed_fact_types: [awardee_organization_identity, public_award, research_activity]
    forbidden_fact_types:
      - award_amount_as_personal_wealth
      - private_residence
      - direct_candidate_publication
      - direct_score_input
    policy: Organization and public-research discovery only; it cannot create a named professional profile without current first-party role evidence.
    source_family: sbir.gov
    candidate_proposal_mode: DISCOVERY_ONLY

